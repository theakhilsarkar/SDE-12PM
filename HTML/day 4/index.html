<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <center>
      <table border="1" cellspacing="0" cellpadding="5">
        <tr>
          <td>Name</td>
          <td><input type="text" placeholder="your name" /></td>
        </tr>
        <tr>
          <td>Email</td>
          <td><input type="email" /></td>
        </tr>
        <tr>
          <td>Password</td>
          <td><input type="password" /></td>
        </tr>
        <tr>
          <td>Telephone</td>
          <td><input type="tel" /></td>
        </tr>
        <tr>
          <td>Age</td>
          <td><input type="number" /></td>
        </tr>
        <tr>
          <td>Birthdate</td>
          <td><input type="date" /></td>
        </tr>
        <tr>
          <td>Skin</td>
          <td><input type="color" /></td>
        </tr>
        <tr>
          <td>Range</td>
          <td><input type="range" /></td>
        </tr>
        <tr>
          <td>Upload Photo</td>
          <td><input type="file" /></td>
        </tr>
        <tr>
          <td>Gender</td>
          <td>
            <input checked type="radio" name="gender" /> Male
            <input type="radio" name="gender" /> Female
          </td>
        </tr>
        <tr>
          <td>Skills</td>
          <td><input type="checkbox" checked /> HTML <input type="checkbox" /> CSS</td>
        </tr>
        <tr>
          <td>Address</td>
          <td>
            <textarea required placeholder="Address..."></textarea>
          </td>   
        </td>
        </tr>
        <tr>
          <td>City</td>
          <td>
            <select>
                <option value="1">Surat</option>
                <option value="2">Ahemdabad</option>
                <option selected value="3">Baroda</option>
            </select>
          </td>   
        </td>
        </tr>
        <tr>
            <td colspan="2">
                <center>
                    <button>Submit</button>
                </center>
            </td>
        </tr>
      </table>
    </center>
  </body>
</html>
