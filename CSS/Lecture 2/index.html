<!doctype html>
<html>
  <head>
    <title>Fonts & Icons Example</title>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Remix Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon" />

    <style>
      body {
        font-family: "Poppins", sans-serif;
        text-align: center;
        margin-top: 50px;
      }
      .icon {
        font-size: 30px;
        margin: 10px;
        color: #007bff;
      }
    </style>
  </head>
  <body>
    <h1>Font & Icon Attachment</h1>
    <p>This text uses Google Font (Poppins).</p>

    <!-- Font Awesome Icon -->
    <i class="fa-solid fa-user icon"></i>

    <!-- Remix Icon -->
    <i class="ri-home-line icon"></i>

    <!-- SVG Icon -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="30"
      height="30"
      fill="#007bff"
      class="bi bi-star icon"
      viewBox="0 0 16 16"
    >
      <path
        d="M2.866 14.85c-.078.444.36.791.746.593l4.39-2.256 4.39 2.256c.386.198.824-.149.746-.592l-.83-4.73 3.523-3.356c.33-.314.158-.888-.283-.95l-4.898-.696L8.465.792a.513.513 0 0 0-.927 0L5.354 5.12l-4.898.696c-.441.062-.613.636-.282.95l3.522 3.356-.83 4.73z"
      />
    </svg>
  </body>
</html>
